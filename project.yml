name: Starlane
options:
  bundleIdPrefix: com.ravo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

packages:
  StarlaneCore:
    path: Packages/StarlaneCore
  # AdMob. Pinned exactly: an ads SDK that moves under you between builds is not worth the surprise.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 13.9.0
  # Google's consent SDK (GDPR forms, US state signals). Also pulled in by GoogleMobileAds; declared
  # here so `import UserMessagingPlatform` is an explicit dependency rather than a lucky transitive.
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    exactVersion: 3.1.0

# Local StoreKit catalog. Not bundled with the app — the Run action points at it so the simulator can
# buy every product without App Store Connect.
fileGroups:
  - Starlane.storekit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: X3VVWK6698
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_PREVIEWS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO

targets:
  Starlane:
    type: application
    platform: iOS
    sources:
      - path: Starlane
        excludes:
          - "Info.plist"
    dependencies:
      - package: StarlaneCore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: Starlane/Info.plist
      properties:
        CFBundleDisplayName: Starlane
        LSApplicationCategoryType: public.app-category.games
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        UIAppFonts:
          - BigShouldersDisplay.ttf
          - InstrumentSans.ttf
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Save your run card to Photos.
        # AdMob app ID. Debug builds use Google's test app; the Release value must be replaced with
        # the real one from AdMob ▸ Apps ▸ Starlane ▸ App settings before shipping. See ADMOB.md.
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        NSUserTrackingUsageDescription: Starlane asks so the ads that keep the game free can be relevant to you. Say no and you still get ads, just untargeted ones.
        # Google's published SKAdNetwork buyers, for install attribution without the IDFA.
        # Source: developers.google.com/admob/ios/quick-start — re-copy when Google updates the list.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
