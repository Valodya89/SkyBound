          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ravo.skybound
        PRODUCT_NAME: Starlane
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only. Each of these defaults to YES, and each one on its own is enough to put the
        # app on hardware it was never designed or tested for: a portrait-locked, viewport-relative
        # lane runner. TARGETED_DEVICE_FAMILY above keeps it off iPad.
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      configs:
        # Google's public test app ID: development traffic never touches the real account.
        Debug:
          ADMOB_APP_ID: ca-app-pub-9054557293639529~8799879891
        # TODO: replace with the real AdMob app ID before the first App Store build.
        Release:
          ADMOB_APP_ID: ca-app-pub-9054557293639529~8799879891

  StarlaneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StarlaneTests
    dependencies:
      - target: Starlane
      - package: StarlaneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ravo.skybound.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Starlane:
    build:
      targets:
        Starlane: all
        StarlaneTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Starlane.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StarlaneTests
        - package: StarlaneCore/StarlaneCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
