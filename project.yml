name: SkyBound
options:
  bundleIdPrefix: com.ravosolutions
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

packages:
  SkyBoundCore:
    path: Packages/SkyBoundCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_PREVIEWS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO

targets:
  SkyBound:
    type: application
    platform: iOS
    sources:
      - path: SkyBound
        excludes:
          - "Info.plist"
    dependencies:
      - package: SkyBoundCore
    info:
      path: SkyBound/Info.plist
      properties:
        CFBundleDisplayName: SkyBound
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        UIAppFonts:
          - BigShouldersDisplay.ttf
          - InstrumentSans.ttf
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ravosolutions.skybound
        PRODUCT_NAME: SkyBound
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games

  SkyBoundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SkyBoundTests
    dependencies:
      - target: SkyBound
      - package: SkyBoundCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ravosolutions.skybound.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SkyBound:
    build:
      targets:
        SkyBound: all
        SkyBoundTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SkyBoundTests
        - package: SkyBoundCore/SkyBoundCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
